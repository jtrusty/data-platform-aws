[tools]
actionlint = "1.7.12"
aws-cli = "2.36.22"
ripgrep = "15.1.0"
terraform = "1.15.8"
tflint = "0.64.0"
trivy = "0.73.0"

[tasks.fmt]
description = "Format Terraform files"
run = "terraform fmt -recursive"

[tasks."fmt:check"]
description = "Check Terraform formatting"
run = "terraform fmt -check -recursive"

[tasks.validate]
description = "Initialize and validate each Terraform root and module"
run = '''
set -eu
rg --files infra -g 'versions.tf' | sed 's#/versions.tf$##' | sort -u | while read -r directory; do
  TF_DATA_DIR="$PWD/$directory/.terraform-ci" terraform -chdir="$directory" init -backend=false -input=false
  TF_DATA_DIR="$PWD/$directory/.terraform-ci" terraform -chdir="$directory" validate
done
'''

[tasks.test]
description = "Run Terraform tests"
run = '''
set -eu
rg --files infra -g '*.tftest.hcl' | sed 's#/tests/.*##' | sort -u | while read -r directory; do
  TF_DATA_DIR="$PWD/$directory/.terraform-ci" terraform -chdir="$directory" init -backend=false -input=false
  TF_DATA_DIR="$PWD/$directory/.terraform-ci" terraform -chdir="$directory" test
done
'''

[tasks.contract]
description = "Verify fixed environment provider and state boundaries"
run = '''
set -eu
for environment in management sandbox development production; do
  bootstrap="infra/bootstrap/$environment"
  test -f "$bootstrap/backend.tf.example"
  rg -F 'backend "s3" {}' "$bootstrap/backend.tf.example"
  if rg -F 'backend "s3" {}' "$bootstrap/versions.tf"; then
    echo "bootstrap root must start with local state: $bootstrap" >&2
    exit 1
  fi
done

for environment in sandbox development production; do
  root="infra/environments/$environment"
  bootstrap="infra/bootstrap/$environment"
  rg -F 'allowed_account_ids = [var.aws_account_id]' "$root/main.tf"
  rg -F 'Environment = local.environment' "$root/main.tf"
  rg -F 'region         = "us-east-2"' "$root/backend.hcl.example"
  rg -F "key            = \"data-platform/$environment/terraform.tfstate\"" "$root/backend.hcl.example"
  rg -F 'kms_key_id' "$root/backend.hcl.example"
  rg -F "key          = \"bootstrap/terraform.tfstate\"" "$bootstrap/backend.hcl.example"
  rg -F 'kms_key_id' "$bootstrap/backend.hcl.example"
done
rg -F 'allowed_account_ids = ["699599381258"]' infra/organization/versions.tf
rg -F 'key          = "organization/terraform.tfstate"' infra/organization/backend.hcl.example
rg -F 'kms_key_id' infra/organization/backend.hcl.example
rg -F 'key          = "bootstrap/management/terraform.tfstate"' infra/bootstrap/management/backend.hcl.example
rg -F 'kms_key_id' infra/bootstrap/management/backend.hcl.example

if rg 'thumbprint_list\s*=\s*\[\]' infra/modules/account_bootstrap; then
  echo "GitHub OIDC thumbprints must be AWS-managed to avoid perpetual drift" >&2
  exit 1
fi

deployment_workflow=".github/workflows/deploy.yml"
test -f "$deployment_workflow"
rg -F 'id-token: write' "$deployment_workflow"
rg -F "github.event.pull_request.head.repo.full_name == github.repository" "$deployment_workflow"
rg -F "inputs.target == 'production-plan'" "$deployment_workflow"
rg -F 'environment: production-plan' "$deployment_workflow"
rg -F 'environment: development' "$deployment_workflow"
rg -F 'environment: production' "$deployment_workflow"
rg -F 'environment: sandbox' "$deployment_workflow"
rg -F 'aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c' "$deployment_workflow"
rg -F 'environment=development' "$deployment_workflow"
rg -F 'apply -input=false' "$deployment_workflow"
'''

[tasks.lint]
description = "Lint Terraform"
run = "tflint --init && tflint --recursive"

[tasks."lint:actions"]
description = "Lint GitHub Actions workflows"
run = "actionlint"

[tasks.security]
description = "Scan Terraform for high-value security findings"
run = "trivy config --exit-code 1 --severity HIGH,CRITICAL --skip-dirs '**/.terraform' --skip-version-check infra"

[tasks.secrets]
description = "Scan committed source for credentials and secret material"
run = "trivy fs --scanners secret --exit-code 1 --skip-dirs .git --skip-dirs '**/.terraform' --skip-version-check ."

[tasks.check]
description = "Run all local CI checks"
run = '''
set -eu
mise run fmt:check
mise run validate
mise run test
mise run contract
mise run lint
mise run lint:actions
mise run security
mise run secrets
'''
